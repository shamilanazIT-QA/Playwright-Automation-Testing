name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        # Add any other libraries you use here

    - name: Ensure browsers are installed
      run: playwright install --with-deps
    - name: Run Multiple Windows Test
      run: python tests/test_windows_pom.py
      env:
        # This tells Playwright to save a report if we were using a test runner,
        # but for now, we'll focus on the GitHub Artifact upload.
        CI: true
    - name: Upload Test Report
      if: always() # This ensures the report is saved even if the test fails!
      uses: actions/upload-artifact@v4
      with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30






